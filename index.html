<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DISCARD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<title>DISCARD</title>
<style>
  html[data-theme="light"] { --bg:#fff; --fg:#000; --mid:#8a8a8a; --hair:#e4e4e4; --chip:rgba(0,0,0,.25); }
  html[data-theme="dark"]  { --bg:#000; --fg:#fff; --mid:#7d7d7d; --hair:#242424; --chip:rgba(255,255,255,.3); }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:"Helvetica Neue",Helvetica,"Hiragino Kaku Gothic ProN","Noto Sans JP",Arial,sans-serif;
    font-size:12px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .screen { display:none; max-width:560px; margin:0 auto; padding:0 18px 120px; }
  .screen.on { display:block; }

  /* top bar */
  .bar {
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0 10px; border-bottom:1px solid var(--fg);
  }
  .bar .l, .bar .r { min-width:70px; }
  .bar .r { text-align:right; }
  .bar .c { font-size:11px; letter-spacing:.06em; }
  .bar button {
    border:none; background:none; color:var(--fg); font-family:inherit;
    font-size:11px; padding:4px 0; cursor:pointer;
  }
  .bar button.mute { color:var(--mid); }

  /* home */
  .hero { padding:44px 0 30px; border-bottom:1px solid var(--fg); }
  .hero h1 { font-size:46px; font-weight:400; letter-spacing:-.02em; margin:0; line-height:1; }
  .hero p { font-size:11px; color:var(--mid); margin:14px 0 0; max-width:32em; line-height:1.8; }

  .bigbtn {
    display:block; width:100%; padding:22px; margin-top:20px;
    border:1px solid var(--fg); background:var(--fg); color:var(--bg);
    font-family:inherit; font-size:13px; text-align:left; cursor:pointer;
  }
  .bigbtn.ghost { background:var(--bg); color:var(--fg); }
  .bigbtn .sub { display:block; font-size:10px; opacity:.6; margin-top:4px; }
  input[type="file"] { display:none; }

  .themerow { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--fg); margin-top:20px; }
  .themerow button { padding:9px; border:none; background:var(--bg); color:var(--fg); font-family:inherit; font-size:10px; cursor:pointer; }
  .themerow button+button { border-left:1px solid var(--fg); }
  .themerow button.on { background:var(--fg); color:var(--bg); }

  /* sections */
  .sec { border-top:1px solid var(--fg); margin-top:24px; padding-top:8px; }
  .sechead { display:flex; gap:10px; align-items:baseline; margin-bottom:12px; }
  .sechead .num { font-size:11px; color:var(--mid); min-width:18px; }
  .sechead .name { font-size:11px; }
  .subhead { font-size:11px; color:var(--mid); margin:16px 0 8px; }
  .note { font-size:10px; color:var(--mid); margin-top:6px; line-height:1.6; }

  /* ledger */
  .ledger { border:1px solid var(--fg); padding:16px; }
  .ledger .big { font-size:30px; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .ledger .biglbl { font-size:10px; color:var(--mid); margin-top:4px; }
  .ledger .rows { margin-top:14px; border-top:1px solid var(--hair); }
  .ledger .r { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--hair); font-size:11px; }
  .ledger .r:last-child { border-bottom:none; }
  .ledger .r .v { font-variant-numeric:tabular-nums; }

  /* canvas */
  .srcwrap { position:relative; line-height:0; border:1px solid var(--fg); }
  #srcCanvas { width:100%; display:block; cursor:crosshair; touch-action:manipulation; }
  .xv,.xh { position:absolute; background:#ff2d16; pointer-events:none; display:none; }
  .xv { width:1px; top:0; bottom:0; }
  .xh { height:1px; left:0; right:0; }
  .readout { display:flex; justify-content:space-between; font-size:10px; color:var(--mid); padding-top:6px; }

  /* controls */
  .slider { display:grid; grid-template-columns:82px 1fr 42px; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--hair); }
  .slider:last-child { border-bottom:none; }
  .slider .val { text-align:right; font-variant-numeric:tabular-nums; }
  input[type="range"] { -webkit-appearance:none; appearance:none; width:100%; height:1px; background:var(--fg); outline:none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; background:var(--fg); cursor:pointer; margin-top:-5.5px; }
  input[type="range"]::-moz-range-thumb { width:12px; height:12px; background:var(--fg); border:none; border-radius:0; }

  .toggles { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--fg); }
  .toggles button { padding:11px 10px; border:none; background:var(--bg); color:var(--fg); font-family:inherit; font-size:11px; text-align:left; cursor:pointer; }
  .toggles button+button { border-left:1px solid var(--fg); }
  .toggles button.on { background:var(--fg); color:var(--bg); }

  .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; border:1px solid var(--fg); }
  .tabs button { padding:11px 4px; border:none; background:var(--bg); color:var(--fg); font-family:inherit; font-size:11px; cursor:pointer; }
  .tabs button+button { border-left:1px solid var(--fg); }
  .tabs button.on { background:var(--fg); color:var(--bg); }

  .cloth { border:1px solid var(--fg); border-top:none; line-height:0; }
  .cloth canvas { width:100%; display:block; }
  .clothcap { font-size:10px; color:var(--mid); padding-top:5px; display:flex; justify-content:space-between; }
  .placeholder { height:180px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--mid); border:1px solid var(--hair); }

  /* tables */
  table.thread { width:100%; border-collapse:collapse; font-size:11px; font-variant-numeric:tabular-nums; }
  table.thread th { text-align:left; font-weight:400; color:var(--mid); font-size:10px; padding:4px 6px; border-bottom:1px solid var(--fg); }
  table.thread td { padding:5px 6px; border-bottom:1px solid var(--hair); }
  table.thread td.sw { width:26px; }
  .chipbox { display:block; width:18px; height:18px; border:1px solid var(--chip); }
  .tablewrap { max-height:260px; overflow-y:auto; border:1px solid var(--fg); padding:0 10px 6px; }

  .palette { display:flex; flex-wrap:wrap; border:1px solid var(--fg); }
  .palette .pc { flex:1 0 12.5%; height:32px; position:relative; }
  .palette .pc span { position:absolute; bottom:2px; left:3px; font-size:9px; }

  /* fields */
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:10px; color:var(--mid); margin-bottom:4px; }
  .field input {
    width:100%; padding:11px; border:1px solid var(--fg); background:var(--bg); color:var(--fg);
    font-family:inherit; font-size:12px; border-radius:0;
  }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .precrow { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--fg); }
  .precrow button { padding:9px 2px; border:none; background:var(--bg); color:var(--fg); font-family:inherit; font-size:10px; cursor:pointer; }
  .precrow button+button { border-left:1px solid var(--fg); }
  .precrow button.on { background:var(--fg); color:var(--bg); }

  .titlebox { border:1px solid var(--fg); padding:14px; }
  .titlebox .t { font-size:13px; font-variant-numeric:tabular-nums; line-height:1.7; word-break:break-all; }

  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .actions.one { grid-template-columns:1fr; }
  .actions button { padding:14px 6px; border:1px solid var(--fg); background:var(--bg); color:var(--fg); font-family:inherit; font-size:11px; cursor:pointer; }
  .actions button.primary { background:var(--fg); color:var(--bg); }

  /* archive */
  .arcgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .arcitem { border:1px solid var(--fg); cursor:pointer; }
  .arcitem img { width:100%; display:block; aspect-ratio:1/1; object-fit:cover; }
  .arcitem .cap { padding:7px 8px; border-top:1px solid var(--fg); font-size:9px; line-height:1.5; font-variant-numeric:tabular-nums; word-break:break-all; }
  .empty { padding:70px 0; text-align:center; font-size:11px; color:var(--mid); }

  .detail { border:1px solid var(--fg); padding:14px; margin-top:14px; }
  .detail img { width:100%; display:block; border:1px solid var(--fg); margin-bottom:12px; }

  .foot { margin-top:36px; border-top:1px solid var(--fg); padding-top:8px; font-size:10px; color:var(--mid); display:flex; justify-content:space-between; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen on" id="scHome">
  <div class="hero">
    <h1>DISCARD</h1>
    <p>写真の一点を残し、その他すべてを捨てる。残った色は縞になり、捨てた量は数として記録される。</p>
  </div>

  <label class="bigbtn" for="fileInput">写真を追加<span class="sub">カメラロールから選ぶ</span></label>
  <input type="file" id="fileInput" accept="image/*">

  <button class="bigbtn ghost" id="toArchive">アーカイブ<span class="sub" id="arcCount">0 件</span></button>

  <div class="themerow">
    <button id="thLight" class="on">白</button>
    <button id="thDark">黒</button>
  </div>

  <div class="foot"><span>DISCARD</span><span>v3</span></div>
</div>

<!-- ============ EDIT ============ -->
<div class="screen" id="scEdit">
  <div class="bar">
    <div class="l"><button id="editBack" class="mute">もどる</button></div>
    <div class="c">編集</div>
    <div class="r"><button id="editOk">完了</button></div>
  </div>

  <div class="sec" style="border-top:none;">
    <div class="sechead"><span class="num">01</span><span class="name">破棄</span></div>
    <div class="ledger">
      <div class="big" id="discardBig">—</div>
      <div class="biglbl">px discarded</div>
      <div class="rows">
        <div class="r"><span>元の画素数</span><span class="v" id="totalPx">—</span></div>
        <div class="r"><span>使用した画素数</span><span class="v" id="usedPx">—</span></div>
        <div class="r"><span>開示率</span><span class="v" id="ratePx">—</span></div>
        <div class="r"><span>元の寸法</span><span class="v" id="dimPx">—</span></div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">02</span><span class="name">選ぶ</span></div>
    <div class="srcwrap">
      <canvas id="srcCanvas"></canvas>
      <div class="xv" id="xv"></div><div class="xh" id="xh"></div>
    </div>
    <div class="readout"><span id="coord">x — / y —</span><span id="srcsize">—</span></div>
    <div class="actions one"><button id="randomBtn">別の一点をランダムに</button></div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">03</span><span class="name">編む</span></div>
    <div class="slider"><span>経糸の本数</span><input type="range" id="warpN" min="8" max="200" value="40"><span class="val" id="warpNV">40</span></div>
    <div class="slider"><span>緯糸の本数</span><input type="range" id="weftN" min="8" max="200" value="40"><span class="val" id="weftNV">40</span></div>
    <div class="slider"><span>糸の色数</span><input type="range" id="palN" min="2" max="16" value="8"><span class="val" id="palNV">8</span></div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">04</span><span class="name">整える</span></div>
    <div class="slider"><span>彩度</span><input type="range" id="sat" min="0" max="250" value="100" step="5"><span class="val" id="satV">100</span></div>
    <div class="slider"><span>コントラスト</span><input type="range" id="con" min="50" max="200" value="100" step="5"><span class="val" id="conV">100</span></div>
    <div class="toggles" style="margin-top:12px;">
      <button id="tgMirror">鏡像に折り返す</button>
      <button id="tgSort">明度順に並べる</button>
    </div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">05</span><span class="name">見る</span></div>
    <div class="tabs">
      <button id="pvFront" class="on">縦</button>
      <button id="pvBack">横</button>
      <button id="pvWoven">布</button>
    </div>
    <div class="cloth">
      <canvas id="frontCanvas"></canvas>
      <canvas id="backCanvas" class="hidden"></canvas>
      <canvas id="wovenCanvas" class="hidden"></canvas>
    </div>
    <div class="clothcap"><span id="pvCap">表 — 経糸／横一列</span><span id="pvMeta">—</span></div>
  </div>

  <div class="actions one" style="margin-top:22px;">
    <button class="primary" id="editOk2">完了して書き出しへ</button>
  </div>
</div>

<!-- ============ OUTPUT ============ -->
<div class="screen" id="scOut">
  <div class="bar">
    <div class="l"><button id="outBack" class="mute">編集にもどる</button></div>
    <div class="c">書き出し</div>
    <div class="r"><button id="outSave">保存</button></div>
  </div>

  <div class="sec" style="border-top:none;">
    <div class="sechead"><span class="num">01</span><span class="name">糸の色</span></div>
    <div class="palette" id="paletteRow"></div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">02</span><span class="name">経糸</span></div>
    <p class="subhead">左から順に張る</p>
    <div class="tablewrap"><table class="thread" id="warpTable"></table></div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">03</span><span class="name">緯糸</span></div>
    <p class="subhead">下から順に打ち込む</p>
    <div class="tablewrap"><table class="thread" id="weftTable"></table></div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">04</span><span class="name">位置情報</span></div>
    <div class="two">
      <div class="field"><label>緯度</label><input type="text" id="latIn" inputmode="decimal" placeholder="35.5661"></div>
      <div class="field"><label>経度</label><input type="text" id="lngIn" inputmode="decimal" placeholder="139.3739"></div>
    </div>
    <div class="precrow">
      <button data-p="6">6桁</button><button data-p="4">4桁</button>
      <button data-p="3" class="on">3桁</button><button data-p="2">2桁</button>
    </div>
    <p class="note" id="gpsSrc">—</p>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">05</span><span class="name">題名</span></div>
    <div class="titlebox"><div class="t" id="titleOut">—</div></div>
    <div class="field" style="margin-top:10px;">
      <label>副題（任意）</label>
      <input type="text" id="subtitleIn" placeholder="">
    </div>
  </div>

  <div class="sec">
    <div class="sechead"><span class="num">06</span><span class="name">書き出し</span></div>
    <div class="actions">
      <button id="csvBtn">通し表 CSV</button>
      <button id="clothBtn">布の画像 PNG</button>
    </div>
    <div class="actions one">
      <button id="cardBtn">メタデータカード PNG</button>
    </div>
    <div class="actions one" style="margin-top:18px;">
      <button class="primary" id="saveBtn">保存してアーカイブへ</button>
    </div>
  </div>
</div>

<!-- ============ ARCHIVE ============ -->
<div class="screen" id="scArc">
  <div class="bar">
    <div class="l"><button id="arcBack" class="mute">ホーム</button></div>
    <div class="c">アーカイブ</div>
    <div class="r"><span id="arcNum" style="color:var(--mid);"></span></div>
  </div>
  <div id="arcEmpty" class="empty">まだ何も捨てていません</div>
  <div class="arcgrid" id="arcGrid"></div>
  <div id="arcDetail"></div>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
function nf(n){ return n.toLocaleString('en-US'); }

/* ---------- storage ---------- */
var MEM = [];
var HAS_LS = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
function loadAll(){
  if(!HAS_LS) return MEM;
  try { return JSON.parse(localStorage.getItem('discard.entries') || '[]'); } catch(e){ return []; }
}
function saveAll(list){
  if(!HAS_LS){ MEM = list; return; }
  try { localStorage.setItem('discard.entries', JSON.stringify(list)); }
  catch(e){ alert('保存容量がいっぱいです。古い記録を削除してください。'); }
}

/* ---------- screens ---------- */
function show(id){
  ['scHome','scEdit','scOut','scArc'].forEach(function(s){ $(s).classList.toggle('on', s===id); });
  window.scrollTo(0,0);
}
$('editBack').addEventListener('click', function(){ show('scHome'); });
$('editOk').addEventListener('click', goOut);
$('editOk2').addEventListener('click', goOut);
$('outBack').addEventListener('click', function(){ show('scEdit'); });
$('outSave').addEventListener('click', saveEntry);
$('saveBtn').addEventListener('click', saveEntry);
$('toArchive').addEventListener('click', function(){ renderArchive(); show('scArc'); });
$('arcBack').addEventListener('click', function(){ show('scHome'); });
function goOut(){ if(!state) return; renderOutput(); show('scOut'); }

/* ---------- theme ---------- */
var theme='light';
function setTheme(t){
  theme=t; document.documentElement.setAttribute('data-theme',t);
  $('thLight').classList.toggle('on',t==='light'); $('thDark').classList.toggle('on',t==='dark');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t==='dark'?'#000000':'#ffffff');
  if(HAS_LS) localStorage.setItem('discard.theme', t);
}
$('thLight').addEventListener('click',function(){setTheme('light');});
$('thDark').addEventListener('click',function(){setTheme('dark');});
if(HAS_LS && localStorage.getItem('discard.theme')) setTheme(localStorage.getItem('discard.theme'));

/* ---------- state ---------- */
var srcCanvas=$('srcCanvas'), srcCtx=srcCanvas.getContext('2d',{willReadFrequently:true});
var frontCanvas=$('frontCanvas'), backCanvas=$('backCanvas'), wovenCanvas=$('wovenCanvas');
var fCtx=frontCanvas.getContext('2d'), bCtx=backCanvas.getContext('2d'), wCtx=wovenCanvas.getContext('2d');
var img=null, pt=null, orig=null, fileName='';
var gps=null, gpsFrom='—', shotAt=null, precision=3;
var mirror=false, sortLum=false, state=null;

function bindS(id,out){ var s=$(id),o=$(out);
  s.addEventListener('input',function(){ o.textContent=s.value; render(); }); return s; }
var warpN=bindS('warpN','warpNV'), weftN=bindS('weftN','weftNV'), palN=bindS('palN','palNV');
var sat=bindS('sat','satV'), con=bindS('con','conV');
$('tgMirror').addEventListener('click',function(){ mirror=!mirror; this.classList.toggle('on',mirror); render(); });
$('tgSort').addEventListener('click',function(){ sortLum=!sortLum; this.classList.toggle('on',sortLum); render(); });

var pvTabs=[['pvFront',frontCanvas,'表 — 経糸／横一列'],['pvBack',backCanvas,'裏 — 緯糸／縦一列'],['pvWoven',wovenCanvas,'織り上がりの推定']];
pvTabs.forEach(function(t){
  $(t[0]).addEventListener('click',function(){
    pvTabs.forEach(function(u){ $(u[0]).classList.remove('on'); u[1].classList.add('hidden'); });
    $(t[0]).classList.add('on'); t[1].classList.remove('hidden');
    $('pvCap').textContent=t[2];
  });
});

document.querySelectorAll('.precrow button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.precrow button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); precision=parseInt(b.dataset.p,10); updateTitle();
  });
});
$('latIn').addEventListener('input',manualGps);
$('lngIn').addEventListener('input',manualGps);
function manualGps(){
  var la=parseFloat($('latIn').value), ln=parseFloat($('lngIn').value);
  if(!isNaN(la)&&!isNaN(ln)){ gps={lat:la,lng:ln}; gpsFrom='手入力'; } else { gps=null; }
  $('gpsSrc').textContent='取得元: '+gpsFrom; updateTitle();
}

/* ---------- EXIF ---------- */
function readExif(buffer){
  var dv=new DataView(buffer);
  if(dv.getUint16(0)!==0xFFD8) return null;
  var off=2,len=dv.byteLength;
  while(off<len-4){
    if(dv.getUint8(off)!==0xFF){ off++; continue; }
    var m=dv.getUint8(off+1), size=dv.getUint16(off+2);
    if(m===0xE1){ var s=off+4; if(dv.getUint32(s)!==0x45786966) return null; return parseTiff(dv,s+6); }
    off+=2+size;
  }
  return null;
}
function parseTiff(dv,base){
  var little=dv.getUint16(base)===0x4949;
  var ifd0=base+dv.getUint32(base+4,little), n=dv.getUint16(ifd0,little);
  var gpsOff=0, exifOff=0, out={gps:null,dt:null};
  for(var i=0;i<n;i++){ var e=ifd0+2+i*12, tag=dv.getUint16(e,little);
    if(tag===0x8825) gpsOff=base+dv.getUint32(e+8,little);
    if(tag===0x8769) exifOff=base+dv.getUint32(e+8,little); }
  if(exifOff){ var en=dv.getUint16(exifOff,little);
    for(var k=0;k<en;k++){ var ee=exifOff+2+k*12;
      if(dv.getUint16(ee,little)===0x9003){
        var cnt=dv.getUint32(ee+4,little), p=cnt>4?base+dv.getUint32(ee+8,little):ee+8, str='';
        for(var z=0;z<cnt-1;z++) str+=String.fromCharCode(dv.getUint8(p+z));
        out.dt=str; } } }
  if(gpsOff){
    var gn=dv.getUint16(gpsOff,little), tags={};
    for(var j=0;j<gn;j++){
      var g=gpsOff+2+j*12, t=dv.getUint16(g,little), ty=dv.getUint16(g+2,little), c=dv.getUint32(g+4,little);
      if(ty===2){ var q=c>4?base+dv.getUint32(g+8,little):g+8; tags[t]=String.fromCharCode(dv.getUint8(q)); }
      else if(ty===5){ var r=base+dv.getUint32(g+8,little), arr=[];
        for(var mm=0;mm<c;mm++){ var num=dv.getUint32(r+mm*8,little), den=dv.getUint32(r+mm*8+4,little); arr.push(den?num/den:0); }
        tags[t]=arr; } }
    if(tags[2]&&tags[4]){
      var lat=tags[2][0]+tags[2][1]/60+tags[2][2]/3600;
      var lng=tags[4][0]+tags[4][1]/60+tags[4][2]/3600;
      if(tags[1]==='S') lat=-lat; if(tags[3]==='W') lng=-lng;
      out.gps={lat:lat,lng:lng}; } }
  return out;
}

/* ---------- file ---------- */
$('fileInput').addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file) return;
  fileName=file.name;
  var buf=new FileReader();
  buf.onload=function(ev){
    gps=null; shotAt=null; gpsFrom='未取得（手入力）';
    try{ var r=readExif(ev.target.result);
      if(r&&r.gps){ gps=r.gps; gpsFrom='写真のEXIF'; }
      if(r&&r.dt) shotAt=r.dt.replace(/^(\d{4}):(\d{2}):(\d{2})/,'$1.$2.$3');
    }catch(err){}
    if(gps){ $('latIn').value=gps.lat.toFixed(6); $('lngIn').value=gps.lng.toFixed(6); }
    else { $('latIn').value=''; $('lngIn').value=''; }
    $('gpsSrc').textContent='取得元: '+gpsFrom;
    updateTitle();
  };
  buf.readAsArrayBuffer(file);

  var rd=new FileReader();
  rd.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      img=im; orig={w:im.naturalWidth,h:im.naturalHeight};
      var sc=Math.min(1,900/orig.w);
      srcCanvas.width=Math.max(2,Math.round(orig.w*sc));
      srcCanvas.height=Math.max(2,Math.round(orig.h*sc));
      srcCtx.drawImage(img,0,0,srcCanvas.width,srcCanvas.height);
      $('srcsize').textContent='表示 '+srcCanvas.width+' × '+srcCanvas.height;
      pt={x:Math.floor(srcCanvas.width/2),y:Math.floor(srcCanvas.height/2)};
      show('scEdit'); setTimeout(function(){ mark(); render(); },30);
    };
    im.src=ev.target.result;
  };
  rd.readAsDataURL(file);
  e.target.value='';
});

srcCanvas.addEventListener('click',function(e){
  if(!img) return;
  var r=srcCanvas.getBoundingClientRect();
  pt={ x:Math.max(0,Math.min(srcCanvas.width-1,Math.round((e.clientX-r.left)*(srcCanvas.width/r.width)))),
       y:Math.max(0,Math.min(srcCanvas.height-1,Math.round((e.clientY-r.top)*(srcCanvas.height/r.height)))) };
  mark(); render();
});
$('randomBtn').addEventListener('click',function(){
  if(!img) return;
  pt={x:Math.floor(Math.random()*srcCanvas.width),y:Math.floor(Math.random()*srcCanvas.height)};
  mark(); render();
});
function origPt(){
  if(!pt||!orig) return {x:0,y:0};
  return { x:Math.round(pt.x*orig.w/srcCanvas.width), y:Math.round(pt.y*orig.h/srcCanvas.height) };
}
function mark(){
  if(!pt) return;
  var r=srcCanvas.getBoundingClientRect();
  $('xv').style.display=$('xh').style.display='block';
  $('xv').style.left=(pt.x*r.width/srcCanvas.width)+'px';
  $('xh').style.top=(pt.y*r.height/srcCanvas.height)+'px';
  var o=origPt(); $('coord').textContent='x '+o.x+' / y '+o.y;
  updateLedger(); updateTitle();
}
window.addEventListener('resize',mark);
function counts(){
  var total=orig.w*orig.h, used=orig.w+orig.h-1;
  return { total:total, used:used, disc:total-used, rate:used/total*100 };
}
function updateLedger(){
  if(!orig) return; var c=counts();
  $('discardBig').textContent=nf(c.disc);
  $('totalPx').textContent=nf(c.total);
  $('usedPx').textContent=nf(c.used);
  $('ratePx').textContent=c.rate.toFixed(4)+' %';
  $('dimPx').textContent=orig.w+' × '+orig.h;
}

/* ---------- color ---------- */
function lum(c){ return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
function hx(c){ return '#'+c.map(function(v){ return ('0'+Math.round(Math.max(0,Math.min(255,v))).toString(16)).slice(-2); }).join(''); }
function adj(c){ var s=+sat.value/100,k=+con.value/100,g=lum(c);
  return c.map(function(v){return g+(v-g)*s;}).map(function(v){return (v-128)*k+128;}); }
function kmeans(cols,k){
  if(!cols.length) return [];
  k=Math.min(k,cols.length);
  var cent=[],step=Math.floor(cols.length/k);
  for(var i=0;i<k;i++) cent.push(cols[Math.min(cols.length-1,i*step)].slice());
  var as=new Array(cols.length).fill(0);
  for(var it=0;it<12;it++){
    for(var p=0;p<cols.length;p++){ var b=0,bd=Infinity;
      for(var c=0;c<k;c++){ var d=0; for(var ch=0;ch<3;ch++){var t=cols[p][ch]-cent[c][ch]; d+=t*t;}
        if(d<bd){bd=d;b=c;} } as[p]=b; }
    var sm=[],cn=[];
    for(var q=0;q<k;q++){ sm.push([0,0,0]); cn.push(0); }
    for(var r=0;r<cols.length;r++){ var a=as[r]; cn[a]++;
      for(var c2=0;c2<3;c2++) sm[a][c2]+=cols[r][c2]; }
    for(var m=0;m<k;m++) if(cn[m]) cent[m]=sm[m].map(function(v){return v/cn[m];});
  }
  cent.sort(function(a,b){return lum(a)-lum(b);});
  return cent;
}
function near(c,pal){ var b=0,bd=Infinity;
  for(var i=0;i<pal.length;i++){ var d=0; for(var ch=0;ch<3;ch++){var t=c[ch]-pal[i][ch]; d+=t*t;} if(d<bd){bd=d;b=i;} }
  return b; }
function samp(a,n){ var o=[]; for(var i=0;i<n;i++) o.push(a[Math.floor(i*(a.length-1)/(n-1||1))]); return o; }
function tr(seq){ var s=seq.map(adj);
  if(sortLum) s.sort(function(a,b){return lum(a)-lum(b);});
  if(mirror){ var h=s.slice(0,Math.ceil(s.length/2)); s=h.concat(h.slice().reverse()).slice(0,seq.length); }
  return s; }

function render(){
  if(!img||!pt) return;
  var w=srcCanvas.width,h=srcCanvas.height;
  var rr=srcCtx.getImageData(0,pt.y,w,1).data, rowL=[];
  for(var i=0;i<w;i++) rowL.push([rr[i*4],rr[i*4+1],rr[i*4+2]]);
  var cc=srcCtx.getImageData(pt.x,0,1,h).data, colL=[];
  for(var j=0;j<h;j++) colL.push([cc[j*4],cc[j*4+1],cc[j*4+2]]);

  var nW=+warpN.value, nF=+weftN.value;
  var wa=tr(samp(rowL,nW)), we=tr(samp(colL,nF));
  var pal=kmeans(wa.concat(we),+palN.value);
  var wi=wa.map(function(c){return near(c,pal);});
  var fi=we.map(function(c){return near(c,pal);});

  var W=1200,H=1200;
  [frontCanvas,backCanvas,wovenCanvas].forEach(function(cv){cv.width=W;cv.height=H;});
  var bw=W/nW, bh=H/nF;
  for(var a=0;a<nW;a++){ fCtx.fillStyle=hx(pal[wi[a]]); fCtx.fillRect(Math.floor(a*bw),0,Math.ceil(bw)+1,H); }
  for(var b=0;b<nF;b++){ bCtx.fillStyle=hx(pal[fi[b]]); bCtx.fillRect(0,Math.floor(b*bh),W,Math.ceil(bh)+1); }
  for(var y=0;y<nF;y++) for(var x=0;x<nW;x++){
    var cw=pal[wi[x]], cf=pal[fi[y]];
    wCtx.fillStyle=hx([cw[0]*.72+cf[0]*.28, cw[1]*.72+cf[1]*.28, cw[2]*.72+cf[2]*.28]);
    wCtx.fillRect(Math.floor(x*bw),Math.floor(y*bh),Math.ceil(bw)+1,Math.ceil(bh)+1);
  }
  $('pvMeta').textContent=nW+' × '+nF;
  state={pal:pal,warpIdx:wi,weftIdx:fi};
  updateTitle();
}

/* ---------- output ---------- */
function runs(idx){
  var out=[],cur=idx[0],from=1;
  for(var i=1;i<idx.length;i++) if(idx[i]!==cur){ out.push({c:cur,from:from,to:i}); cur=idx[i]; from=i+1; }
  out.push({c:cur,from:from,to:idx.length}); return out;
}
function table(id,idx,pal){
  var html='<tr><th></th><th>番号</th><th>本数</th><th>色</th></tr>';
  runs(idx).forEach(function(r){
    var l=r.from===r.to?r.from:r.from+'–'+r.to;
    html+='<tr><td class="sw"><span class="chipbox" style="background:'+hx(pal[r.c])+'"></span></td><td>'+l+'</td><td>'+(r.to-r.from+1)+'</td><td>'+String.fromCharCode(65+r.c)+' '+hx(pal[r.c])+'</td></tr>';
  });
  $(id).innerHTML=html;
}
function renderOutput(){
  var prow=$('paletteRow'); prow.innerHTML='';
  state.pal.forEach(function(c,i){
    var d=document.createElement('div'); d.className='pc'; d.style.background=hx(c);
    var s=document.createElement('span'); s.textContent=String.fromCharCode(65+i);
    s.style.color=lum(c)>140?'#000':'#fff'; d.appendChild(s); prow.appendChild(d);
  });
  table('warpTable',state.warpIdx,state.pal);
  table('weftTable',state.weftIdx,state.pal);
  updateTitle();
}
function titleStr(){
  if(!pt) return '—';
  var o=origPt();
  var loc=gps?gps.lat.toFixed(precision)+', '+gps.lng.toFixed(precision):'––.–––, –––.–––';
  return loc+'  x:'+o.x+' y:'+o.y;
}
function updateTitle(){ $('titleOut').textContent=titleStr(); }

/* ---------- exports ---------- */
$('csvBtn').addEventListener('click',function(){
  if(!state) return;
  var c=counts(), o=origPt();
  var L=['# '+titleStr(),'','# 記録'];
  L.push('元の寸法,'+orig.w+'x'+orig.h);
  L.push('元の画素数,'+c.total); L.push('使用画素数,'+c.used);
  L.push('破棄画素数,'+c.disc); L.push('開示率,'+c.rate.toFixed(4)+'%');
  L.push('','# 糸の色');
  state.pal.forEach(function(col,i){ L.push(String.fromCharCode(65+i)+','+hx(col)); });
  L.push('','# 経糸（左から）','番号,本数,色');
  runs(state.warpIdx).forEach(function(r){ L.push((r.from===r.to?r.from:r.from+'-'+r.to)+','+(r.to-r.from+1)+','+String.fromCharCode(65+r.c)); });
  L.push('','# 緯糸（下から）','番号,本数,色');
  runs(state.weftIdx).forEach(function(r){ L.push((r.from===r.to?r.from:r.from+'-'+r.to)+','+(r.to-r.from+1)+','+String.fromCharCode(65+r.c)); });
  dl(new Blob(['\uFEFF'+L.join('\n')],{type:'text/csv;charset=utf-8'}),'discard-'+o.x+'-'+o.y+'.csv');
});
function dl(blob,name){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }

$('clothBtn').addEventListener('click',function(){
  var pad=40,gap=30, cv=document.createElement('canvas');
  cv.width=1200+pad*2; cv.height=pad*2+1200*3+gap*2;
  var c=cv.getContext('2d');
  c.fillStyle=theme==='dark'?'#000':'#fff'; c.fillRect(0,0,cv.width,cv.height);
  c.drawImage(frontCanvas,pad,pad);
  c.drawImage(backCanvas,pad,pad+1230);
  c.drawImage(wovenCanvas,pad,pad+2460);
  cv.toBlob(function(b){ dl(b,'discard-cloth-'+Date.now()+'.png'); });
});

function makeCard(){
  var dark=theme==='dark';
  var bg=dark?'#000':'#fff', fg=dark?'#fff':'#000', mid=dark?'#7d7d7d':'#8a8a8a', hair=dark?'#262626':'#e2e2e2';
  var W=1400,H=1980,M=110;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  var c=cv.getContext('2d');
  c.fillStyle=bg; c.fillRect(0,0,W,H);
  var sh=760;
  c.drawImage(frontCanvas,M,300,W-M*2,sh);
  c.strokeStyle=fg; c.lineWidth=2; c.strokeRect(M,300,W-M*2,sh);
  var cnt=counts();
  c.fillStyle=fg; c.font='400 62px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillText('DISCARD',M,150);
  c.fillStyle=mid; c.font='400 26px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillText(titleStr(),M,205);
  var y=300+sh+120;
  c.fillStyle=fg; c.font='400 108px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillText(nf(cnt.disc),M,y);
  c.fillStyle=mid; c.font='400 26px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillText('px discarded',M,y+44);
  var sub=$('subtitleIn').value.trim();
  var rows=[['source',orig.w+' × '+orig.h+' px'],['total',nf(cnt.total)+' px'],
    ['used',nf(cnt.used)+' px'],['rate',cnt.rate.toFixed(4)+' %'],
    ['shot',shotAt||'—'],['threads',state.warpIdx.length+' warp / '+state.weftIdx.length+' weft'],
    ['colours',state.pal.length]];
  if(sub) rows.push(['note',sub]);
  var ry=y+130;
  c.font='400 28px "Helvetica Neue",Helvetica,Arial,sans-serif';
  rows.forEach(function(r){
    c.strokeStyle=hair; c.lineWidth=1;
    c.beginPath(); c.moveTo(M,ry+14); c.lineTo(W-M,ry+14); c.stroke();
    c.fillStyle=mid; c.fillText(r[0],M,ry);
    c.fillStyle=fg; var t=String(r[1]);
    c.fillText(t,W-M-c.measureText(t).width,ry);
    ry+=62;
  });
  c.fillStyle=mid; c.font='400 22px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillText(fileName,M,H-70);
  return cv;
}
$('cardBtn').addEventListener('click',function(){
  if(!state) return;
  var o=origPt();
  makeCard().toBlob(function(b){ dl(b,'discard-card-'+o.x+'-'+o.y+'.png'); });
});

/* ---------- save ---------- */
function thumb(){
  var t=document.createElement('canvas'); t.width=t.height=360;
  var c=t.getContext('2d'); c.drawImage(frontCanvas,0,0,360,360);
  return t.toDataURL('image/jpeg',0.8);
}
function saveEntry(){
  if(!state||!orig) return;
  var c=counts(), o=origPt();
  var list=loadAll();
  list.unshift({
    id:'d'+Date.now(),
    title:titleStr(),
    subtitle:$('subtitleIn').value.trim(),
    thumb:thumb(),
    file:fileName, shot:shotAt||'',
    lat:gps?gps.lat:null, lng:gps?gps.lng:null, prec:precision,
    x:o.x, y:o.y, w:orig.w, h:orig.h,
    total:c.total, used:c.used, disc:c.disc, rate:c.rate,
    warp:state.warpIdx, weft:state.weftIdx,
    pal:state.pal.map(hx),
    at:new Date().toISOString()
  });
  saveAll(list);
  renderArchive();
  show('scArc');
}

/* ---------- archive ---------- */
function renderArchive(){
  var list=loadAll();
  $('arcNum').textContent=list.length+' 件';
  $('arcCount').textContent=list.length+' 件';
  $('arcDetail').innerHTML='';
  var g=$('arcGrid'); g.innerHTML='';
  $('arcEmpty').style.display=list.length?'none':'block';
  list.forEach(function(e){
    var d=document.createElement('div'); d.className='arcitem';
    d.innerHTML='<img src="'+e.thumb+'"><div class="cap">'+e.title+'<br>'+nf(e.disc)+' px</div>';
    d.addEventListener('click',function(){ detail(e.id); });
    g.appendChild(d);
  });
}
function detail(id){
  var list=loadAll(), e=null;
  for(var i=0;i<list.length;i++) if(list[i].id===id) e=list[i];
  if(!e) return;
  var rows=[['source',e.w+' × '+e.h+' px'],['total',nf(e.total)+' px'],['used',nf(e.used)+' px'],
    ['discarded',nf(e.disc)+' px'],['rate',e.rate.toFixed(4)+' %'],
    ['point','x:'+e.x+' y:'+e.y],['shot',e.shot||'—'],
    ['threads',e.warp.length+' warp / '+e.weft.length+' weft'],['colours',e.pal.length],
    ['file',e.file]];
  var html='<div class="detail"><img src="'+e.thumb+'">';
  html+='<div style="font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:12px;">'+e.title+'</div>';
  if(e.subtitle) html+='<div class="note" style="margin-bottom:10px;">'+e.subtitle+'</div>';
  html+='<div class="ledger" style="border:none;padding:0;"><div class="rows" style="margin-top:0;">';
  rows.forEach(function(r){ html+='<div class="r"><span>'+r[0]+'</span><span class="v">'+r[1]+'</span></div>'; });
  html+='</div></div>';
  html+='<div class="actions" style="margin-top:14px;"><button id="dCsv">CSV</button><button id="dDel">削除</button></div></div>';
  $('arcDetail').innerHTML=html;
  $('arcDetail').scrollIntoView({behavior:'smooth'});
  $('dDel').addEventListener('click',function(){
    if(!confirm('この記録を削除しますか')) return;
    saveAll(loadAll().filter(function(x){return x.id!==id;}));
    renderArchive();
  });
  $('dCsv').addEventListener('click',function(){
    var L=['# '+e.title,'','元の寸法,'+e.w+'x'+e.h,'元の画素数,'+e.total,'使用画素数,'+e.used,
      '破棄画素数,'+e.disc,'開示率,'+e.rate.toFixed(4)+'%','座標,x'+e.x+' y'+e.y,'','# 糸の色'];
    e.pal.forEach(function(c,i){ L.push(String.fromCharCode(65+i)+','+c); });
    L.push('','# 経糸','番号,本数,色');
    runs(e.warp).forEach(function(r){ L.push((r.from===r.to?r.from:r.from+'-'+r.to)+','+(r.to-r.from+1)+','+String.fromCharCode(65+r.c)); });
    L.push('','# 緯糸','番号,本数,色');
    runs(e.weft).forEach(function(r){ L.push((r.from===r.to?r.from:r.from+'-'+r.to)+','+(r.to-r.from+1)+','+String.fromCharCode(65+r.c)); });
    dl(new Blob(['\uFEFF'+L.join('\n')],{type:'text/csv;charset=utf-8'}),'discard-'+e.x+'-'+e.y+'.csv');
  });
}
renderArchive();
</script>
